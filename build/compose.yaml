# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  simple-file-server:
    image: simple-file-server
    build:
      context: ..
      dockerfile: ./backend/src/SimpleFileServer.Web/Dockerfile
    restart: "on-failure"
    ports:
      - ${FILE_SERVER_PORT:-5100}:80
    volumes:
      - simple-file-server-storage:/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  simple-file-server-storage:
